---
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/test_server.py -v

      - name: Build image
        run: docker build -t kitinerary-mcp:test .

      - name: Run integration tests against the built image
        env:
          IMAGE_TAG: kitinerary-mcp:test
        run: pytest tests/test_integration.py -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive versions
        id: versions
        run: |
          SERVER_VERSION="${GITHUB_REF_NAME#v}"
          KITINERARY_VERSION="$(grep -oP '(?<=^ARG KITINERARY_VERSION=)\S+' Dockerfile)"
          echo "server_version=${SERVER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "kitinerary_version=${KITINERARY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SERVER_VERSION=${{ steps.versions.outputs.server_version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-kitinerary${{ steps.versions.outputs.kitinerary_version }}
            ghcr.io/${{ github.repository }}:latest
